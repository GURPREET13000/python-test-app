name: Deploy to PythonAnywhere

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.pythonanywhere.com
          username: GURPREET1307
          key: ${{ secrets.PA_SSH_PRIVATE_KEY }}
          script: |
            cd /home/GURPREET1307/python-test-app
            git pull origin main
            source /home/GURPREET1307/.virtualenvs/myenv/bin/activate
            pip install -r requirements.txt
            touch /var/www/gurpreet1307_pythonanywhere_com_wsgi.py
